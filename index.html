<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#EF1A3C" />
  <title>Billaura Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="copyright" content="© Billaura. All rights reserved." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="loginScreen" class="login-screen" hidden>
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-mark"></div>
          <h1>Billaura Admin</h1>
          <p>Platform owner console</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label>Admin email</label>
            <input type="email" id="adminEmail" class="input" placeholder="you@email.com" autocomplete="username" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPassword" class="input" placeholder="Password" autocomplete="current-password" required />
          </div>
          <p class="hint" id="loginHint"></p>
          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>
      </div>
    </div>

    <!-- Main shell -->
    <div id="adminShell" class="admin-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark sm"></div>
          <div>
            <div class="brand-name">Billaura</div>
            <div class="brand-sub">Admin</div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <button class="nav-link active" data-page="dashboard">Dashboard</button>
          <button class="nav-link" data-page="shops">Shops</button>
          <button class="nav-link" data-page="plans">Plans</button>
          <button class="nav-link" data-page="subscriptions">Subscriptions</button>
          <button class="nav-link" data-page="payments">Payments <span class="dot" id="payDot" hidden></span></button>
          <button class="nav-link" data-page="announcements">Announcements</button>
          <button class="nav-link" data-page="licence">Licence</button>
          <button class="nav-link" data-page="settings">Settings</button>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-link danger" id="logoutBtn">Sign out</button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
          <h2 id="pageTitle">Dashboard</h2>
          <div class="topbar-right">
            <span class="pill" id="envPill">Local mode</span>
          </div>
        </header>
        <main class="content" id="content"></main>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="modalRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/admin-cloud.js"></script>
  <script src="js/admin-extra.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
